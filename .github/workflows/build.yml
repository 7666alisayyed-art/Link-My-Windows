name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        run: |
          flutter create --platforms=android --project-name link_my_windows --org com.linkmywindows .
          git checkout -- lib pubspec.yaml
          rm -rf test
          cp native_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/linkmywindows/link_my_windows
          cp native_android/MainActivity.kt android/app/src/main/kotlin/com/linkmywindows/link_my_windows/MainActivity.kt
          cp native_android/ScreenService.kt android/app/src/main/kotlin/com/linkmywindows/link_my_windows/ScreenService.kt
          if [ -f android/build.gradle.kts ]; then
            cat native_android/compile_sdk_patch.gradle.kts.txt android/build.gradle.kts > android/build.tmp
            mv android/build.tmp android/build.gradle.kts
          else
            cat native_android/compile_sdk_patch.groovy.txt android/build.gradle > android/build.tmp
            mv android/build.tmp android/build.gradle
          fi
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk LinkMyWindows.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LinkMyWindows-Android
          path: LinkMyWindows.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LinkMyWindows.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows app
        shell: bash
        run: |
          flutter create --platforms=windows --project-name link_my_windows --org com.linkmywindows .
          git checkout -- lib pubspec.yaml
          rm -rf test
          sed -i 's|L"link_my_windows"|L"Link my Windows"|' windows/runner/main.cpp
          flutter pub get
          flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LinkMyWindows-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LinkMyWindows-Windows
          path: LinkMyWindows-Windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LinkMyWindows-Windows.zip
