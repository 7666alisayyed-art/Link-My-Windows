version: 1.4.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.4
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.2.8
  window_manager: ">=0.4.3 <0.6.0"

flutter:
  uses-material-design: true
