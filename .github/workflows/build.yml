name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        run: |
          flutter create --platforms=android --project-name link_my_windows --org com.linkmywindows .
          git checkout -- lib pubspec.yaml
          rm -rf test
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Link my Windows"|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk LinkMyWindows.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LinkMyWindows-Android
          path: LinkMyWindows.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LinkMyWindows.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows app
        shell: bash
        run: |
          flutter create --platforms=windows --project-name link_my_windows --org com.linkmywindows .
          git checkout -- lib pubspec.yaml
          rm -rf test
          sed -i 's|L"link_my_windows"|L"Link my Windows"|' windows/runner/main.cpp
          flutter pub get
          flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath LinkMyWindows-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LinkMyWindows-Windows
          path: LinkMyWindows-Windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LinkMyWindows-Windows.zip
